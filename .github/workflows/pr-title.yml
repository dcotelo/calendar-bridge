name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # CHANGELOG.md is generated from Conventional Commits, and a squash merge
      # takes its subject from the PR title — so a title that doesn't parse
      # becomes a changelog entry nobody can read.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          # Scopes are optional, but when present should name a package or area.
          requireScope: false
          # Two rules, and the message below states exactly these two: the
          # subject must not START with a capital, and must not END with a
          # period. Note it does not *require* a lowercase letter — "2 accounts
          # are required" is fine — so the message must not promise that.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: >-
            The subject "{subject}" is invalid: it must not start with a capital
            letter and must not end with a period, e.g.
            "fix(sync): skip declined invitations".
