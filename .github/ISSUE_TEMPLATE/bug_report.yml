name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. Include your config.yaml shape if relevant (redact real credentials/paths).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Output from `sync-once` or `run` around the time of the issue. Redact anything sensitive.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD` or the release tag you're on.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running calendar-bridge?
      options:
        - go run / local binary
        - Docker
        - Fly.io
        - Kubernetes
        - Other
    validations:
      required: true
