# calendar-bridge config
#
# Copy to config.yaml and fill in your accounts. Do NOT commit config.yaml,
# credentials files, or token files — they're all gitignored by default.

accounts:
  - name: personal
    credentials_file: secrets/personal-credentials.json
    token_file: secrets/personal-token.json
    calendar_id: primary

  - name: work-acme
    credentials_file: secrets/work-acme-credentials.json
    token_file: secrets/work-acme-token.json
    calendar_id: primary

  # Add as many accounts as you need (personal Gmail + N Workspace domains).
  # - name: work-other
  #   credentials_file: secrets/work-other-credentials.json
  #   token_file: secrets/work-other-token.json
  #   calendar_id: primary

poll_interval: 5m
lookahead_days: 30
block_title: "Busy (calendar-bridge)"

# Optional: near-real-time sync via Google Calendar push notifications
# (events.watch). Opt-in — leave disabled to poll only (the default). Requires
# a publicly reachable HTTPS endpoint routing to listen_addr. See docs/webhooks.md.
#
# webhook:
#   enabled: true
#   public_url: https://cb.example.com   # must be https; receiver lives at /webhook
#   listen_addr: "127.0.0.1:8080"        # loopback, behind a TLS-terminating proxy on
#                                        # the same host; if the proxy runs elsewhere
#                                        # (e.g. a separate container), bind the address
#                                        # it reaches and isolate the port at the network
#                                        # level instead — never expose plaintext HTTP
#   verification_token: "CHANGE-ME-long-random-secret"  # secret; authenticates notifications
#   channel_ttl: "24h"                   # watch channel lifetime; renewed ahead of expiry
#   debounce_interval: "5s"              # coalesce a burst of changes into one sync

# Optional: local configuration web UI (see docs/web-ui.md). Off by default.
# Loopback only — non-loopback binds are refused unconditionally, auth_token
# notwithstanding; the UI never exposes credential or token file contents to
# the browser. Run with: calendar-bridge ui
#
# web_ui:
#   enabled: true
#   listen_addr: "127.0.0.1:8090"   # loopback only; non-loopback binds are refused
#   auth_token: "CHANGE-ME-long-random-secret"  # optional; defense-in-depth on a shared host
