apiVersion: v1
kind: Service
metadata:
  name: calendar-bridge-metrics
  labels:
    app.kubernetes.io/name: calendar-bridge
spec:
  # ClusterIP only. The metrics endpoint is read-only and unauthenticated;
  # it should never be exposed outside the cluster.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calendar-bridge
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
