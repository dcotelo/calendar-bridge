# Fly.io app configuration for calendar-bridge.
#
# Read docs/deployment/fly.md before deploying — in particular the note about
# absolute paths, which is the one thing that reliably catches people.
#
# Setup, in order:
#   calendar-bridge auth ...              # locally, first: the flow needs a browser
#   fly launch --no-deploy                # creates the app; adjust name/region
#   fly volumes create cb_config --size 1 -a <your-app>
#   fly deploy                            # fails: the volume has no config yet
#   fly ssh console -a <your-app> -C "mkdir -p /app/config/secrets"
#   fly ssh sftp shell -a <your-app>      # upload config.yaml and secrets/
#   fly deploy

app = "calendar-bridge"
primary_region = "iad"

[build]

[mounts]
  source = "cb_config"
  destination = "/app/config"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# There is deliberately NO [[services]] block.
#
# calendar-bridge is a background poller, not an HTTP service. With no services
# declared, Fly publishes no ports and the machine is unreachable from the
# internet, which is exactly what we want. The optional metrics endpoint binds
# loopback and is reached with `fly proxy 9090:9090`.
#
# There is also deliberately no auto_stop_machines: there is no inbound request
# to wake a stopped machine, so auto-stop would just mean it stops syncing.
