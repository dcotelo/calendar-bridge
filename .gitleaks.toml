# gitleaks configuration for calendar-bridge.
[extend]
useDefault = true

# Allowlisting by PATH would disable scanning for those files entirely: when an
# allowlist sets several criteria, a path match alone is enough to suppress a
# finding, so a real secret committed to README.md or a googleauth test would be
# silently ignored. A secret scanner that answers "no leaks" without looking is
# worse than none, because it is trusted.
#
# So this allowlists the specific fabricated VALUES instead. Each one is a
# literal string that appears in the fixtures and documentation, and none of
# them is a credential for anything that exists.
[allowlist]
description = "Fabricated values used by tests, fixtures and documentation placeholders."
regexTarget = "match"
regexes = [
  # Documentation placeholders the reader is expected to replace.
  '''CHANGE-ME[-A-Za-z0-9_]*''',
  '''NOT-A-REAL-SECRET''',
  # Tokens fabricated by the googleauth and sync tests.
  '''fake-(access|refresh)-token''',
  '''ya29\.FAKE[-A-Za-z0-9_]*''',
  # The screenshot and demo fixtures' OAuth client. There is no such project.
  '''0{12}-demofixture\.apps\.googleusercontent\.com''',
  '''demo-fixture-not-a-secret''',
]
